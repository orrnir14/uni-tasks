<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My University Tasks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="rail" id="rail"></aside>
    <main id="main"></main>
  </div>

  <!-- Task dialog -->
  <dialog id="taskDlg">
    <form class="f" id="taskForm" method="dialog">
      <h2 id="taskTitle" class="dlg-title">New task</h2>
      <label><span data-i18n="taskWhat"></span><input id="tTitle" required data-i18n-placeholder="taskPlaceholder"></label>
      <div class="two">
        <label><span data-i18n="course"></span><select id="tCourse"></select></label>
        <label><span data-i18n="type"></span><select id="tType"></select></label>
      </div>
      <label><span data-i18n="dueDate"></span><input id="tDue" type="date"></label>
      <label><span data-i18n="notes"></span><textarea id="tNotes" data-i18n-placeholder="notesPlaceholder"></textarea></label>
      <div class="acts">
        <button type="button" class="btn danger" id="tDel" data-i18n="delete"></button>
        <div>
          <button type="button" class="btn alt" id="tCancel" data-i18n="cancel"></button>
          <button class="btn" id="tSave" data-i18n="save"></button>
        </div>
      </div>
    </form>
  </dialog>

  <!-- Course dialog -->
  <dialog id="courseDlg">
    <form class="f" id="courseForm" method="dialog">
      <h2 id="courseTitle" class="dlg-title">New course</h2>
      <label><span data-i18n="courseName"></span><input id="cName" required data-i18n-placeholder="coursePlaceholder"></label>
      <label><span data-i18n="courseInfo"></span><input id="cInfo" data-i18n-placeholder="courseInfoPlaceholder"></label>
      <div>
        <div class="field-label" data-i18n="color"></div>
        <div class="swatches" id="cColors"></div>
      </div>
      <div class="acts">
        <button type="button" class="btn danger" id="cDel" data-i18n="deleteCourse"></button>
        <div>
          <button type="button" class="btn alt" id="cCancel" data-i18n="cancel"></button>
          <button class="btn" data-i18n="save"></button>
        </div>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo" data-i18n="undo"></button></div>

  <script src="app.js"></script>
</body>
</html>
